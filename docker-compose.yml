name: be-fast

services:
  postgres:
    image: postgres:18.7-trixie@sha256:2ea8630df176ad090ec92136dee850397c5af8781e4bcf2e4162593691c61bbc
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-be_fast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-be_fast_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-be_fast}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    build: ./docker/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-be_fast}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-be_fast_minio_dev_only}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9000/minio/health/ready",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  minio-data:
